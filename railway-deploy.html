<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apurv Task App - Railway Deploy</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif; }
        * { box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel" data-type="module">
        const { BrowserRouter, Routes, Route, Navigate, Link } = ReactRouterDOM;
        const { useState, useEffect, useContext, createContext } = React;

        // Auth Context
        const AuthContext = createContext();
        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                setTimeout(() => {
                    setUser({ id: '1', name: 'Demo User', email: 'demo@example.com', role: 'Admin' });
                    setLoading(false);
                }, 1000);
            }, []);

            const login = async (email, password) => {
                setUser({ id: '1', name: 'Demo User', email, role: 'Admin' });
                return true;
            };

            const signup = async (name, email, password) => {
                setUser({ id: '1', name, email, role: 'Admin' });
                return true;
            };

            const logout = async () => {
                setUser(null);
            };

            return (
                <AuthContext.Provider value={{ user, loading, login, signup, logout }}>
                    {children}
                </AuthContext.Provider>
            );
        };
        const useAuth = () => useContext(AuthContext);

        // Task Context
        const TaskContext = createContext();
        const TaskProvider = ({ children }) => {
            const [tasks, setTasks] = useState([
                { id: 1, title: 'Complete Project Setup', description: 'Set up complete React application with all features', status: 'In Progress', priority: 'High' },
                { id: 2, title: 'Design Dashboard UI', description: 'Create a beautiful and responsive dashboard interface', status: 'Todo', priority: 'Medium' },
                { id: 3, title: 'Add Authentication', description: 'Implement user login and signup functionality', status: 'Completed', priority: 'High' },
                { id: 4, title: 'Deploy Application', description: 'Deploy app to get a live URL', status: 'Todo', priority: 'Low' }
            ]);

            const addTask = async (task) => {
                const newTask = { ...task, id: Date.now() };
                setTasks([...tasks, newTask]);
            };

            return (
                <TaskContext.Provider value={{ tasks, addTask }}>
                    {children}
                </TaskContext.Provider>
            );
        };

        // Project Context
        const ProjectContext = createContext();
        const ProjectProvider = ({ children }) => {
            const [projects, setProjects] = useState([
                { id: 1, name: 'Task Management System', description: 'Complete task management application with user authentication' },
                { id: 2, name: 'Dashboard Redesign', description: 'Modern dashboard with better UX and responsive design' },
                { id: 3, name: 'Mobile App', description: 'React Native mobile application for task management' }
            ]);

            return (
                <ProjectContext.Provider value={{ projects }}>
                    {children}
                </ProjectContext.Provider>
            );
        };

        // Components
        const Login = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const { login } = useAuth();
            const navigate = ReactRouterDOM.useNavigate();

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const success = await login(email, password);
                setLoading(false);
                if (success) {
                    navigate('/');
                } else {
                    setError('Invalid credentials');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
                    <div className="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
                        <h2 className="text-3xl font-bold text-center mb-6 text-gray-800">Login</h2>
                        {error && <p className="text-red-500 text-center mb-4">{error}</p>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2">Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                    disabled={loading}
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                    disabled={loading}
                                />
                            </div>
                            <button
                                type="submit"
                                className="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200 disabled:opacity-50"
                                disabled={loading}
                            >
                                {loading ? 'Logging in...' : 'Login'}
                            </button>
                        </form>
                        <p className="text-center mt-4 text-gray-600">
                            Don't have an account?{' '}
                            <Link to="/signup" className="text-blue-600 hover:underline">Sign up</Link>
                        </p>
                    </div>
                </div>
            );
        };

        const Signup = () => {
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const { signup } = useAuth();
            const navigate = ReactRouterDOM.useNavigate();

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const success = await signup(name, email, password);
                setLoading(false);
                if (success) {
                    navigate('/');
                } else {
                    setError('Error creating account');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-teal-100">
                    <div className="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
                        <h2 className="text-3xl font-bold text-center mb-6 text-gray-800">Sign Up</h2>
                        {error && <p className="text-red-500 text-center mb-4">{error}</p>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2">Name</label>
                                <input
                                    type="text"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                                    required
                                    disabled={loading}
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2">Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                                    required
                                    disabled={loading}
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                                    required
                                    disabled={loading}
                                />
                            </div>
                            <button
                                type="submit"
                                className="w-full bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 transition duration-200 disabled:opacity-50"
                                disabled={loading}
                            >
                                {loading ? 'Signing up...' : 'Sign Up'}
                            </button>
                        </form>
                        <p className="text-center mt-4 text-gray-600">
                            Already have an account?{' '}
                            <Link to="/login" className="text-green-600 hover:underline">Login</Link>
                        </p>
                    </div>
                </div>
            );
        };

        const ProtectedRoute = ({ children }) => {
            const { user, loading } = useAuth();

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 to-pink-100">
                        <div className="text-2xl font-semibold text-gray-700">Loading...</div>
                    </div>
                );
            }

            if (!user) {
                return <Navigate to="/login" replace />;
            }

            return children;
        };

        const Dashboard = () => {
            const { user, logout } = useAuth();
            const navigate = ReactRouterDOM.useNavigate();
            const [activeTab, setActiveTab] = useState('tasks');
            const { tasks } = useContext(TaskContext);
            const { projects } = useContext(ProjectContext);

            const handleLogout = async () => {
                await logout();
                navigate('/login');
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 to-pink-100 p-8">
                    <div className="max-w-7xl mx-auto">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-4xl font-bold text-gray-800">Dashboard</h1>
                            <div className="flex items-center gap-4">
                                <span className="text-gray-700">
                                    Welcome, {user?.name}! 
                                    {user?.role === 'Admin' && <span className="ml-2 text-xs bg-purple-500 text-white px-2 py-1 rounded-full">Admin</span>}
                                </span>
                                <button
                                    onClick={handleLogout}
                                    className="bg-red-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-700 transition duration-200"
                                >
                                    Logout
                                </button>
                            </div>
                        </div>
                        
                        <div className="flex gap-4 mb-6">
                            <button
                                onClick={() => setActiveTab('tasks')}
                                className={`px-6 py-2 rounded-lg font-semibold transition duration-200 ${activeTab === 'tasks' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`}
                            >
                                Tasks
                            </button>
                            <button
                                onClick={() => setActiveTab('projects')}
                                className={`px-6 py-2 rounded-lg font-semibold transition duration-200 ${activeTab === 'projects' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`}
                            >
                                Projects
                            </button>
                        </div>

                        {activeTab === 'tasks' && (
                            <div className="bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-2xl font-bold mb-4">Tasks</h2>
                                <div className="space-y-4">
                                    {tasks.map(task => (
                                        <div key={task.id} className="border p-4 rounded-lg hover:shadow-md transition-shadow">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h3 className="font-bold text-lg">{task.title}</h3>
                                                    <p className="text-gray-600 mt-1">{task.description}</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <span className={`px-2 py-1 rounded text-sm ${
                                                        task.status === 'Completed' ? 'bg-green-100 text-green-800' :
                                                        task.status === 'In Progress' ? 'bg-yellow-100 text-yellow-800' :
                                                        'bg-blue-100 text-blue-800'
                                                    }`}>
                                                        {task.status}
                                                    </span>
                                                    <span className={`px-2 py-1 rounded text-sm ${
                                                        task.priority === 'High' ? 'bg-red-100 text-red-800' :
                                                        task.priority === 'Medium' ? 'bg-orange-100 text-orange-800' :
                                                        'bg-gray-100 text-gray-800'
                                                    }`}>
                                                        {task.priority}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'projects' && (
                            <div className="bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-2xl font-bold mb-4">Projects</h2>
                                <div className="space-y-4">
                                    {projects.map(project => (
                                        <div key={project.id} className="border p-4 rounded-lg hover:shadow-md transition-shadow">
                                            <h3 className="font-bold text-lg">{project.name}</h3>
                                            <p className="text-gray-600 mt-1">{project.description}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // App Component
        const App = () => {
            return (
                <AuthProvider>
                    <TaskProvider>
                        <ProjectProvider>
                            <BrowserRouter>
                                <Routes>
                                    <Route path="/login" element={<Login />} />
                                    <Route path="/signup" element={<Signup />} />
                                    <Route 
                                        path="/" 
                                        element={
                                            <ProtectedRoute>
                                                <Dashboard />
                                            </ProtectedRoute>
                                        } 
                                    />
                                </Routes>
                            </BrowserRouter>
                        </ProjectProvider>
                    </TaskProvider>
                </AuthProvider>
            );
        };

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
